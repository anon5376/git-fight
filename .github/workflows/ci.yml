name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test native
        run: cargo test --workspace
      - name: Core compiles to wasm
        run: cargo check -p git-fight-core --target wasm32-unknown-unknown
      - name: Install wasm-pack
        run: sh scripts/install-wasm-pack.sh
      - name: Golden test in WebAssembly (Node)
        run: wasm-pack test --node crates/wasm
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web tests
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t git-fight:ci .
      - name: Boot image and hit /health
        run: |
          set -euo pipefail
          cid=$(docker run -d --name git-fight-ci -p 127.0.0.1:8080:8080 git-fight:ci)
          trap 'docker logs "$cid" || true; docker rm -f "$cid" || true' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health; then
              exit 0
            fi
            sleep 1
          done
          echo "container never became healthy"
          exit 1
